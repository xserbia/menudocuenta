<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMC Testing Center</title>
<style>
:root{
  --primary:#3b008f;
  --secondary:#6f42c1;
  --bg:#f7f5fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#222;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  padding:28px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
h1{margin:0;color:var(--primary)}
.subtitle{margin:6px 0 20px;color:#666}
.stats{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
  min-width:150px;
  box-shadow:0 4px 10px rgba(0,0,0,.04);
}
.card span{display:block;color:#666;font-size:13px}
.card strong{font-size:26px;color:var(--primary)}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}
.tab{
  border:none;
  background:#eee8fa;
  color:var(--primary);
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  font-weight:bold;
}
.tab.active{
  background:var(--primary);
  color:#fff;
}
main{padding:28px}
.section{
  display:none;
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.section.active{display:block}
.section-header{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
  border-bottom:2px solid #eee;
  padding-bottom:14px;
  margin-bottom:16px;
}
.section-header h2{
  margin:0;
  color:var(--primary);
}
.add-btn{
  border:none;
  background:var(--secondary);
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}
.header-row,.row{
  display:grid;
  grid-template-columns:50px 1fr 170px 1.3fr 70px;
  gap:12px;
  align-items:center;
}
.header-row{
  font-weight:bold;
  color:var(--primary);
  padding:10px 0;
}
.row{
  border-bottom:1px solid #f0f0f0;
  padding:10px 0;
}
.row:last-child{border-bottom:none}
input[type="checkbox"]{
  width:20px;
  height:20px;
}
.feature.done{
  text-decoration:line-through;
  opacity:.5;
}
select,input[type="text"]{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
}
.delete-btn{
  border:none;
  background:#fee2e2;
  color:#991b1b;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
}
@media(max-width:850px){
  header{position:relative}
  main{padding:16px}
  .header-row{display:none}
  .row{
    grid-template-columns:40px 1fr;
    background:#fafafa;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .row select,.row input[type="text"],.row .delete-btn{
    grid-column:2;
  }
}
</style>
</head>
<body>

<header>
  <h1>EMC Testing Center</h1>
  <p class="subtitle">Master checklist to validate all critical flows before external user testing.</p>

  <div class="stats">
    <div class="card"><span>Total Tasks</span><strong id="totalTasks">0</strong></div>
    <div class="card"><span>Completed</span><strong id="completedTasks">0</strong></div>
    <div class="card"><span>Progress</span><strong id="progressPercent">0%</strong></div>
  </div>

  <div class="tabs" id="tabs"></div>
</header>

<main id="content"></main>

<script>
const defaultFlows = [
  {
    title:"Registration",
    items:["Create Account","Verify Email","Create Password","Login","Password Recovery"]
  },
  {
    title:"Subscription",
    items:["Select Plan","Apply BETATEST Code","Process Payment","Activate Membership","Update Subscription","Cancel Subscription"]
  },
  {
    title:"Accounts",
    items:["Complete Application","Identity Verification","Document Upload","Application Corrections","Account Approval","Account Status Tracking","Open Investment Account","Open Traditional IRA","Open Roth IRA","Open Additional Account","Close Account"]
  },
  {
    title:"Portfolio",
    items:["Complete Risk Questionnaire","Receive Recommendation","Select Portfolio","Confirm Portfolio","View Portfolio Details","Change Portfolio"]
  },
  {
    title:"Banking",
    items:["Connect Bank Account","Verify Micro Deposits","Bank Connection Confirmation","Change Bank Account","Remove Bank Account"]
  },
  {
    title:"Funding",
    items:["Request Deposit","Deposit Status Updates","IBKR Deposit Confirmation","Funds Available","Cash Reflected in Dashboard","Investment Executed","Request Withdrawal","Withdrawal Status Updates","Withdrawal Completed"]
  },
  {
    title:"Dashboard",
    items:["Account Value","Cash Balance","Portfolio Holdings","Performance Tracking","Deposit Status","Withdrawal Status"]
  },
  {
    title:"Beneficiaries",
    items:["Add Beneficiary","Edit Beneficiary","Delete Beneficiary","Beneficiary Visible in Dashboard"]
  },
  {
    title:"Education",
    items:["Access Educational Content","Premium Access Validation","Video Playback","Category Navigation"]
  },
  {
    title:"Profile",
    items:["Update Personal Information","Update Address","Update Phone Number","Update Email","Change Password"]
  },
  {
    title:"Support",
    items:["WhatsApp Support","Support Email","Contact Form","Support Notifications","Cancel Account Form","Internal Cancellation Notification"]
  },
  {
    title:"FAQ & Legal",
    items:["FAQ Links","Privacy Policy","Terms of Service","Legal Disclosures","All Links Working","Content Updated"]
  },
  {
    title:"Notifications",
    items:["Registration Confirmation","Account Approved","Bank Connected","Deposit Requested","Deposit Received","Funds Invested","Withdrawal Requested","Withdrawal Completed","Portfolio Changed","Account Closed"]
  }
];

let flows = JSON.parse(localStorage.getItem("emcFlows")) || defaultFlows;
let activeIndex = Number(localStorage.getItem("activeTab")) || 0;

const tabs = document.getElementById("tabs");
const content = document.getElementById("content");

function saveFlows(){
  localStorage.setItem("emcFlows", JSON.stringify(flows));
}

function taskKey(flowIndex,itemIndex){
  return `emc-task-${flowIndex}-${itemIndex}`;
}

function render(){
  tabs.innerHTML = "";
  content.innerHTML = "";

  flows.forEach((flow, flowIndex)=>{
    const tab = document.createElement("button");
    tab.className = "tab" + (flowIndex === activeIndex ? " active" : "");
    tab.textContent = flow.title;
    tab.onclick = ()=>{
      activeIndex = flowIndex;
      localStorage.setItem("activeTab", activeIndex);
      render();
    };
    tabs.appendChild(tab);

    const section = document.createElement("section");
    section.className = "section" + (flowIndex === activeIndex ? " active" : "");

    section.innerHTML = `
      <div class="section-header">
        <h2>${flow.title}</h2>
        <button class="add-btn" onclick="addTask(${flowIndex})">+ Add Task</button>
      </div>

      <div class="header-row">
        <div>✓</div>
        <div>Feature</div>
        <div>Status</div>
        <div>Notes / Owner</div>
        <div>Delete</div>
      </div>
    `;

    flow.items.forEach((item,itemIndex)=>{
      const key = taskKey(flowIndex,itemIndex);
      const saved = JSON.parse(localStorage.getItem(key)) || {
        checked:false,
        status:"Not Started",
        notes:""
      };

      const row = document.createElement("div");
      row.className = "row";

      row.innerHTML = `
        <input type="checkbox" ${saved.checked ? "checked" : ""}>
        <div class="feature ${saved.checked ? "done" : ""}">${item}</div>
        <select>
          <option ${saved.status==="Not Started" ? "selected" : ""}>Not Started</option>
          <option ${saved.status==="Testing" ? "selected" : ""}>Testing</option>
          <option ${saved.status==="Done" ? "selected" : ""}>Done</option>
        </select>
        <input type="text" placeholder="Owner / Notes" value="${saved.notes}">
        <button class="delete-btn" onclick="deleteTask(${flowIndex},${itemIndex})">✕</button>
      `;

      const checkbox = row.querySelector("input[type='checkbox']");
      const feature = row.querySelector(".feature");
      const status = row.querySelector("select");
      const notes = row.querySelector("input[type='text']");

      function saveTask(){
        localStorage.setItem(key, JSON.stringify({
          checked:checkbox.checked,
          status:status.value,
          notes:notes.value
        }));

        feature.classList.toggle("done", checkbox.checked);

        if(status.value === "Done" && !checkbox.checked){
          checkbox.checked = true;
          feature.classList.add("done");
          localStorage.setItem(key, JSON.stringify({
            checked:true,
            status:status.value,
            notes:notes.value
          }));
        }

        updateStats();
      }

      checkbox.addEventListener("change", saveTask);
      status.addEventListener("change", saveTask);
      notes.addEventListener("input", saveTask);

      section.appendChild(row);
    });

    content.appendChild(section);
  });

  updateStats();
}

function addTask(flowIndex){
  const taskName = prompt("Enter new task:");
  if(!taskName || !taskName.trim()) return;

  flows[flowIndex].items.push(taskName.trim());
  saveFlows();
  render();
}

function deleteTask(flowIndex,itemIndex){
  if(!confirm("Delete this task?")) return;

  localStorage.removeItem(taskKey(flowIndex,itemIndex));
  flows[flowIndex].items.splice(itemIndex,1);
  saveFlows();
  render();
}

function updateStats(){
  const total = flows.reduce((sum,flow)=>sum + flow.items.length,0);
  let completed = 0;

  flows.forEach((flow,flowIndex)=>{
    flow.items.forEach((_,itemIndex)=>{
      const saved = JSON.parse(localStorage.getItem(taskKey(flowIndex,itemIndex)));
      if(saved && (saved.checked || saved.status === "Done")) completed++;
    });
  });

  document.getElementById("totalTasks").textContent = total;
  document.getElementById("completedTasks").textContent = completed;
  document.getElementById("progressPercent").textContent = total ? Math.round((completed/total)*100) + "%" : "0%";
}

render();
</script>

</body>
</html>
