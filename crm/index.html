<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Nunito:wght@400;600;700;800&display=swap"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EMC CRM · Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#24183c;font:15px system-ui,sans-serif}header{background:#fff;padding:22px 5%;border-bottom:1px solid #e4dfed;display:flex;align-items:center;gap:16px}header b{background:#51069c;color:#ffdb35;padding:12px;border-radius:12px;font-size:24px}h1,h2,p{margin:0}h1{font-size:26px}small{color:#756b85}main{max-width:1450px;margin:auto;padding:24px}nav,.panel,.metric{background:white;border:1px solid #e4dfed;border-radius:15px;padding:20px;margin-bottom:16px}nav{display:flex;gap:8px;padding:8px}button,input,select,textarea{font:inherit;border:1px solid #d9d0e8;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer;color:#51069c;font-weight:600}button.active,button.primary{background:#51069c;color:white}nav button{flex:1;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric strong{display:block;font-size:32px;color:#51069c}.stage{background:#f1eafa;padding:16px;border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:8px}.stage strong{font-size:26px}.bar{height:7px;background:#ded5ee;border-radius:9px;overflow:hidden}.bar i{display:block;background:#7137b8;height:100%}.notice{padding:12px;background:#fff4d5;border-radius:10px;margin-bottom:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid #eee}h2{font-size:20px;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}dialog{border:1px solid #ddd;border-radius:16px;width:min(540px,95%);padding:24px}dialog::backdrop{background:#20133388}label{display:block;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:5px} @media(max-width:600px){main{padding:12px}nav button{font-size:12px;padding:8px}}
body{font-family:Kanit,system-ui,sans-serif}h1,h2,h3{font-family:Nunito,system-ui,sans-serif}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.subnav{display:flex;gap:8px;margin-bottom:16px}.subnav button{flex:1}.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center}.donut span{background:white;border-radius:50%;width:88px;height:88px;display:grid;place-items:center;font-size:25px;font-weight:bold}.preview{background:#e5eee7;padding:22px;border-radius:12px;min-height:160px;white-space:pre-wrap}.bubble{background:white;padding:16px;border-radius:12px}.template{border:1px solid #e4dfed;padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:12px}dialog{width:min(850px,95%);max-height:90vh;overflow:auto} .muted{color:#756b85}.danger{color:#b42318}.step{font-size:12px;text-align:center;padding:8px;background:#f1eafa;border-radius:8px} @media(max-width:700px){.split{grid-template-columns:1fr}.subnav{flex-wrap:wrap}}</style></head><body><header><b>mc</b><div><h1>EMC CRM</h1><small>Gestión de clientes · El Menudo Cuenta</small></div></header><main><div class="notice">Modo demostración · Datos ficticios · Sin conexión al Admin · No introducir información real.</div><nav><button data-tab="journey" class="active">Journey</button><button data-tab="comms">Comunicaciones</button><button data-tab="clients">Clientes</button></nav><section id="view"></section></main><dialog id="detail"></dialog><script>
'use strict';
const stages=['Registro','Suscripción','Solicitud IBKR','Cuenta aprobada','Banco conectado','Primer depósito','Primera inversión'];
const eligibility=['Por determinar','Calificado','No calificado','En verificación'];
const rows=Array.from({length:24},(_,i)=>({id:1001+i,name:'Cliente demo '+String(i+1).padStart(2,'0'),stage:[0,0,1,2,3,4,5,6,1,2,0,3][i%12],elig:i%12===0?'No calificado':i%12===1?'Por determinar':'Calificado',days:i%9+1,notes:'',follow:'',channel:'Email'}));
let tab='journey',filter='Todos',stageFilter=-1,query='';
const view=document.querySelector('#view'),detail=document.querySelector('#detail');
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function add(parent,tag,txt,cls){const e=el(tag,txt,cls);parent.append(e);return e}
function btn(parent,txt,fn){const b=add(parent,'button',txt);b.onclick=fn;return b}
function panel(title){const p=add(view,'div',undefined,'panel');add(p,'h2',title);return p}
function openTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{stageFilter=-1;filter='Todos';query='';openTab(b.dataset.tab)});
function render(){view.replaceChildren();if(tab==='journey'){const g=add(view,'div',undefined,'grid');[['Registrados',rows.length],['Suscritos',rows.filter(r=>r.stage>=1).length],['Aprobados',rows.filter(r=>r.stage>=3).length],['Bancos conectados',rows.filter(r=>r.stage>=4).length],['Con depósito',rows.filter(r=>r.stage>=5).length],['Invirtiendo',rows.filter(r=>r.stage>=6).length]].forEach(([l,n])=>{const m=add(g,'div',undefined,'metric');add(m,'strong',n);add(m,'span',l)});const p=panel('Embudo del Journey');const sg=add(p,'div',undefined,'grid');stages.forEach((s,i)=>{const n=rows.filter(r=>r.stage>=i).length,now=rows.filter(r=>r.stage===i).length;const c=add(sg,'div',undefined,'stage');add(c,'strong',n);add(c,'span',s);const bar=add(c,'div',undefined,'bar');add(bar,'i').style.width=(100*n/rows.length)+'%';add(c,'small',Math.round(100*n/rows.length)+'% · '+now+' aquí ahora');btn(c,'Ver '+now+' usuarios',()=>{stageFilter=i;openTab('clients')})});add(p,'small','Alcanzaron la etapa incluye quienes avanzaron. Aquí ahora muestra la etapa actual. Datos simulados.');const a=panel('Tiempo promedio en etapa actual');stages.forEach((s,i)=>{const r=rows.filter(x=>x.stage===i);add(a,'p',s+': '+(r.length?(r.reduce((n,x)=>n+x.days,0)/r.length).toFixed(1)+' días':'—'))});return}
if(tab==='comms'){const p=panel('Segmentos de seguimiento');stages.slice(0,6).forEach((s,i)=>{const n=rows.filter(r=>r.stage===i&&r.elig!=='No calificado').length;const line=add(p,'p',undefined,'filters');btn(line,s+' · '+n,()=>{stageFilter=i;filter='Contactables demo';openTab('clients')})});add(p,'small','No se envían mensajes. El consentimiento real deberá verificarse antes de contactar.');const q=panel('Próximos seguimientos');rows.filter(r=>r.follow).forEach(r=>btn(q,r.follow+' · '+r.name,()=>show(r)));return}
const p=panel('Clientes');const f=add(p,'div',undefined,'filters');const search=add(f,'input');search.placeholder='Buscar nombre o ID';search.value=query;const sel=add(f,'select');['Todos',...eligibility,'Contactables demo'].forEach(v=>{const o=add(sel,'option',v);o.value=v});sel.value=filter;const st=add(f,'select');['Todas las etapas',...stages].forEach((v,i)=>{const o=add(st,'option',v);o.value=i-1});st.value=stageFilter;const out=add(p,'div',undefined,'scroll');function list(){out.replaceChildren();const t=add(out,'table');const h=add(t,'tr');['ID','Cliente','Elegibilidad','Etapa','Días','Acción'].forEach(v=>add(h,'th',v));rows.filter(r=>(filter==='Todos'||(filter==='Contactables demo'?eligible(r):r.elig===filter))&&(stageFilter<0||r.stage===stageFilter)&&(r.name.toLowerCase().includes(query.toLowerCase())||String(r.id).includes(query))).forEach(r=>{const tr=add(t,'tr');[r.id,r.name,r.elig,stages[r.stage],r.days].forEach(v=>add(tr,'td',v));btn(add(tr,'td'),'Ver ficha',()=>show(r))})}search.oninput=()=>{query=search.value;list()};sel.onchange=()=>{filter=sel.value;list()};st.onchange=()=>{stageFilter=Number(st.value);list()};list()}
function show(r){detail.replaceChildren();add(detail,'h2',r.name+' · #'+r.id);add(detail,'p',r.elig+' · '+stages[r.stage]);add(detail,'p','Estado operativo de solo lectura (simulado).');const l=add(detail,'label','Canal');const c=add(l,'select');['Email','WhatsApp','Teléfono'].forEach(v=>add(c,'option',v));c.value=r.channel;const d=add(add(detail,'label','Próximo seguimiento'),'input');d.type='date';d.value=r.follow;const n=add(add(detail,'label','Notas ficticias'),'textarea');n.value=r.notes;n.maxLength=500;btn(detail,'Guardar en esta sesión',()=>{r.channel=c.value;r.follow=d.value;r.notes=n.value;detail.close();render()}).className='primary';btn(detail,'Cerrar',()=>detail.close());detail.showModal()}

// Version 2: isolated synthetic workflow.
rows.forEach((r,i)=>Object.assign(r,{email:'cliente'+r.id+'@example.com',contact:'Sin contactar',history:[],last:'',subscription:r.stage>=1?'Activa (demo)':'Sin activar',account:r.stage>=3?'Aprobada':r.stage>=2?'Pendiente':'No iniciada'}));
const actions=['Activar suscripción','Completar solicitud IBKR','Revisar estado de apertura','Conectar banco','Realizar primer depósito','Completar activación de inversión','Seguimiento de servicio'];
const templates=stages.map((s,i)=>({title:actions[i],stage:i,message:'Hola {nombre}, '+['gracias por registrarte en El Menudo Cuenta. ¿Necesitas ayuda para activar tu suscripción?','ingresa a EMC para completar tu solicitud de apertura.','revisa en EMC si tienes tareas pendientes de apertura. Estamos disponibles para ayudarte.','tu cuenta fue aprobada. Ingresa a EMC para revisar cómo conectar tu banco.','si deseas continuar, revisa cómo realizar tu primer depósito en EMC.','¿Necesitas ayuda para completar los pasos para comenzar a invertir?','estamos disponibles para ayudarte con El Menudo Cuenta.'][i],attachment:null}));
let sub='control',selected=0,templateIndex=0,threshold=7,segment=-1;
const oldRender=render;
function selectOptions(parent,items,value){const s=add(parent,'select');items.forEach(([v,l])=>{const o=add(s,'option',l);o.value=v});s.value=value;return s}
function actionTable(p,items){const wrap=add(p,'div',undefined,'scroll'),t=add(wrap,'table'),head=add(t,'tr');['Cliente','Etapa actual','Días sin avanzar','Acción sugerida','Último contacto','Acción'].forEach(x=>add(head,'th',x));items.sort((a,b)=>b.days-a.days).forEach(r=>{const tr=add(t,'tr');[r.name,stages[r.stage],r.days,actions[r.stage],r.last||'Sin registrar'].forEach((v,i)=>add(tr,'td',v,i===2&&r.days>=threshold?'danger':''));btn(add(tr,'td'),tab==='comms'?'Contactar por WhatsApp':'Abrir ficha',()=>{if(tab==='comms'){selected=rows.indexOf(r);templateIndex=r.stage;sub='wa';render()}else show(r)})});if(!items.length)add(wrap,'p','No hay usuarios en este segmento.')}
function eligible(r){return r.elig!=='No calificado'&&r.contact!=='No contactar'}
render=function(){if(tab==='journey'){oldRender();const time=view.lastElementChild;time.remove();const k=panel('Conversión y activación financiera');const kg=add(k,'div',undefined,'grid');const count=i=>rows.filter(r=>r.stage>=i).length;[[0,1,'Registro → suscripción'],[1,3,'Suscripción → aprobación'],[3,5,'Aprobación → depósito'],[5,6,'Depósito → inversión'],[0,6,'Registro → inversión']].forEach(([a,b,l])=>{const m=add(kg,'div',undefined,'metric');add(m,'strong',count(a)?Math.round(100*count(b)/count(a))+'%':'—');add(m,'span',l)});add(k,'small','Montos agregados depositados e invertidos: no disponibles hasta integrar una fuente autorizada.');const split=add(view,'div',undefined,'split');const status=add(split,'div',undefined,'panel');add(status,'h2','Estado de usuarios');const groups=[['Invirtiendo',rows.filter(r=>r.stage>=6).length,'#20a873'],['No elegibles',rows.filter(r=>r.stage<6&&r.elig==='No calificado').length,'#a6a9b3'],['Estancados',rows.filter(r=>r.stage<6&&r.elig!=='No calificado'&&r.days>=threshold).length,'#f4bd37']];groups.push(['En progreso',rows.length-groups.reduce((n,g)=>n+g[1],0),'#793ac4']);let offset=0;const donut=add(status,'div',undefined,'donut');donut.style.background='conic-gradient('+groups.map(g=>{const start=offset;offset+=100*g[1]/rows.length;return g[2]+' '+start+'% '+offset+'%'}).join(',')+')';add(donut,'span',rows.length);groups.forEach(g=>{const p=add(status,'p',g[0]+' · '+g[1]);p.style.borderLeft='5px solid '+g[2];p.style.paddingLeft='8px';p.style.marginTop='8px'});const times=add(split,'div',undefined,'panel');add(times,'h2','Tiempo promedio en etapa actual');stages.forEach((s,i)=>{const a=rows.filter(r=>r.stage===i),n=a.length?a.reduce((sum,r)=>sum+r.days,0)/a.length:0;add(times,'small',s+' · '+n.toFixed(1)+' días');const b=add(times,'div',undefined,'bar');add(b,'i').style.width=n/9*100+'%';b.style.marginBottom='8px'});const p=panel('Usuarios que requieren acción');const f=add(p,'div',undefined,'filters');const s=selectOptions(f,[[3,'3 días o más'],[7,'7 días o más'],[14,'14 días o más']],threshold);s.onchange=()=>{threshold=Number(s.value);render()};const q=add(f,'input');q.placeholder='Buscar cliente';const target=add(p,'div');function draw(){target.replaceChildren();actionTable(target,rows.filter(r=>eligible(r)&&r.stage<6&&r.days>=threshold&&r.name.toLowerCase().includes(q.value.toLowerCase())))}q.oninput=draw;draw();return}
if(tab==='clients'){oldRender();return}
view.replaceChildren();const nav=add(view,'div',undefined,'subnav');[['control','Centro de control'],['wa','WhatsApp individual'],['lib','Biblioteca']].forEach(([v,l])=>{const b=btn(nav,l,()=>{sub=v;render()});if(sub===v)b.className='active'});
if(sub==='control'){const p=panel('¿Dónde están detenidos los usuarios?');const g=add(p,'div',undefined,'grid');stages.slice(0,6).forEach((s,i)=>{const a=rows.filter(r=>eligible(r)&&r.stage===i);const c=add(g,'div',undefined,'stage');add(c,'strong',a.length);add(c,'span',s);btn(c,'Ver usuarios',()=>{segment=i;render()})});const queue=panel(segment<0?'Usuarios que requieren acción':actions[segment]);btn(queue,'Ver todos los pendientes',()=>{segment=-1;render()});actionTable(queue,rows.filter(r=>eligible(r)&&r.stage<6&&(segment<0?r.days>=threshold:r.stage===segment)));return}
if(sub==='lib'){const p=panel('Biblioteca de WhatsApp');btn(p,'+ Nueva plantilla',()=>editTemplate(-1));const g=add(p,'div',undefined,'grid');g.style.gridTemplateColumns='repeat(auto-fit,minmax(250px,1fr))';templates.forEach((t,i)=>{const c=add(g,'div',undefined,'template');add(c,'small',stages[t.stage]);add(c,'strong',t.title);add(c,'p',t.message);if(t.attachment){const a=add(c,'a',t.attachment.name);a.href=t.attachment.url;a.download=t.attachment.name}btn(c,'Usar',()=>{templateIndex=i;sub='wa';render()});btn(c,'Editar',()=>editTemplate(i))});return}
const p=panel('WhatsApp individual');add(p,'small','Demostración: no se envían mensajes ni se usan números reales.');const g=add(p,'div',undefined,'split'),left=add(g,'div'),right=add(g,'div');const c=selectOptions(add(left,'label','Cliente'),rows.map((r,i)=>[i,r.name]),selected);const t=selectOptions(add(left,'label','Plantilla'),templates.map((x,i)=>[i,x.title]),templateIndex);const m=add(add(left,'label','Mensaje editable'),'textarea');m.rows=7;m.value=templates[templateIndex].message;const u=add(add(left,'label','Enlace adicional'),'input');u.placeholder='https://elmenudocuenta.com';add(right,'h2','Vista previa');const bubble=add(add(right,'div',undefined,'preview'),'div',undefined,'bubble');function preview(){bubble.textContent=m.value.replaceAll('{nombre}',rows[selected].name)+(u.value?'\n'+u.value:'')}c.onchange=()=>{selected=Number(c.value);templateIndex=rows[selected].stage;t.value=templateIndex;m.value=templates[templateIndex].message;preview()};t.onchange=()=>{templateIndex=Number(t.value);m.value=templates[templateIndex].message;preview()};m.oninput=u.oninput=preview;preview();btn(left,'Copiar mensaje',()=>navigator.clipboard.writeText(bubble.textContent).catch(()=>alert('Selecciona el texto de la vista previa para copiarlo.')));const follow=add(add(left,'label','Próximo seguimiento'),'input');follow.type='date';follow.value=rows[selected].follow;const previousChange=c.onchange;c.onchange=()=>{previousChange();follow.value=rows[selected].follow};btn(left,'Registrar contacto simulado',()=>{const r=rows[selected];if(!eligible(r)){alert('Cliente excluido del seguimiento.');return}r.follow=follow.value;r.last=new Date().toLocaleDateString('es-US');r.contact='Contactado';r.history.push({date:r.last,message:bubble.textContent});alert('Contacto ficticio registrado en esta sesión.')});}
function editTemplate(i){detail.replaceChildren();const old=templates[i]||{title:'',stage:0,message:''};add(detail,'h2',i<0?'Nueva plantilla':'Editar plantilla');const title=add(add(detail,'label','Título'),'input');title.value=old.title;const stage=selectOptions(add(detail,'label','Etapa'),stages.map((s,j)=>[j,s]),old.stage);const msg=add(add(detail,'label','Mensaje'),'textarea');msg.value=old.message;const file=add(add(detail,'label','Material de apoyo ficticio'),'input');file.type='file';file.accept='image/*,video/*,application/pdf';btn(detail,'Guardar',()=>{if(!title.value.trim()||!msg.value.trim())return;const f=file.files[0];const item={title:title.value,stage:Number(stage.value),message:msg.value,attachment:f?{name:f.name,url:URL.createObjectURL(f)}:old.attachment};if(i<0)templates.push(item);else templates[i]=item;detail.close();render()});btn(detail,'Cancelar',()=>detail.close());detail.showModal()}
show=function(r){detail.replaceChildren();add(detail,'h2',r.name+' · #'+r.id);add(detail,'p',r.email+' · '+r.elig);const g=add(detail,'div',undefined,'grid');stages.forEach((s,i)=>add(g,'div',(i<r.stage?'✓ ':i===r.stage?'● ':'○ ')+s,'step'));const split=add(detail,'div',undefined,'split');const a=add(split,'div',undefined,'panel');add(a,'h3','Estado de cuenta');[r.subscription,'IBKR: '+r.account,'Banco: '+(r.stage>=4?'Conectado':'Pendiente'),'Depósito: '+(r.stage>=5?'Completado':'Pendiente'),'Inversión: '+(r.stage>=6?'Iniciada':'Pendiente'),'Etapa: '+stages[r.stage]].forEach(x=>add(a,'p',x));const b=add(split,'div',undefined,'panel');add(b,'h3','Actividad');add(b,'p',r.days+' días sin avanzar');add(b,'p','Último contacto: '+(r.last||'Sin registrar'));add(detail,'h3','Acción sugerida');add(detail,'p',actions[r.stage]);btn(detail,'Preparar mensaje',()=>{selected=rows.indexOf(r);templateIndex=r.stage;sub='wa';detail.close();openTab('comms')});const c=selectOptions(add(detail,'label','Estado de contacto'),['Sin contactar','Contactado','Respondió','Esperando respuesta','No interesado','No contactar'].map(x=>[x,x]),r.contact);const d=add(add(detail,'label','Próximo seguimiento'),'input');d.type='date';d.value=r.follow;const n=add(add(detail,'label','Notas de servicio ficticias'),'textarea');n.value=r.notes;add(detail,'h3','Historial de comunicaciones');r.history.forEach(x=>add(detail,'p',x.date+' · '+x.message));if(!r.history.length)add(detail,'small','Sin comunicaciones registradas');btn(detail,'Guardar en esta sesión',()=>{r.contact=c.value;r.follow=d.value;r.notes=n.value;detail.close();render()}).className='primary';btn(detail,'Cerrar',()=>detail.close());detail.showModal()};
render();
</script></body></html>
