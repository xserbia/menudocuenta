<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EMC CRM · Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#24183c;font:15px system-ui,sans-serif}header{background:#fff;padding:22px 5%;border-bottom:1px solid #e4dfed;display:flex;align-items:center;gap:16px}header b{background:#51069c;color:#ffdb35;padding:12px;border-radius:12px;font-size:24px}h1,h2,p{margin:0}h1{font-size:26px}small{color:#756b85}main{max-width:1450px;margin:auto;padding:24px}nav,.panel,.metric{background:white;border:1px solid #e4dfed;border-radius:15px;padding:20px;margin-bottom:16px}nav{display:flex;gap:8px;padding:8px}button,input,select,textarea{font:inherit;border:1px solid #d9d0e8;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer;color:#51069c;font-weight:600}button.active,button.primary{background:#51069c;color:white}nav button{flex:1;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric strong{display:block;font-size:32px;color:#51069c}.stage{background:#f1eafa;padding:16px;border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:8px}.stage strong{font-size:26px}.bar{height:7px;background:#ded5ee;border-radius:9px;overflow:hidden}.bar i{display:block;background:#7137b8;height:100%}.notice{padding:12px;background:#fff4d5;border-radius:10px;margin-bottom:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid #eee}h2{font-size:20px;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}dialog{border:1px solid #ddd;border-radius:16px;width:min(540px,95%);padding:24px}dialog::backdrop{background:#20133388}label{display:block;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:5px} @media(max-width:600px){main{padding:12px}nav button{font-size:12px;padding:8px}}
</style><header><b>mc</b><div><h1>EMC CRM</h1><small>Gestión de clientes · El Menudo Cuenta</small></div></header><main><div class="notice">Modo demostración · Datos ficticios · Sin conexión al Admin · No introducir información real.</div><nav><button data-tab="journey" class="active">Journey</button><button data-tab="comms">Comunicaciones</button><button data-tab="clients">Clientes</button></nav><section id="view"></section></main><dialog id="detail"></dialog><script>
'use strict';
const stages=['Registro','Email confirmado','Teléfono verificado','Suscripción','Solicitud IBKR','Tareas completadas','Cuenta aprobada','Cuenta fondeada'];
const eligibility=['Por determinar','Calificado','No calificado','En verificación'];
const rows=Array.from({length:24},(_,i)=>({id:1001+i,name:'Cliente demo '+String(i+1).padStart(2,'0'),stage:[0,1,2,3,4,5,6,7,3,4,0,2][i%12],elig:eligibility[i%4],days:i%9+1,notes:'',follow:'',channel:'Email'}));
let tab='journey',filter='Todos',stageFilter=-1,query='';
const view=document.querySelector('#view'),detail=document.querySelector('#detail');
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function add(parent,tag,txt,cls){const e=el(tag,txt,cls);parent.append(e);return e}
function btn(parent,txt,fn){const b=add(parent,'button',txt);b.onclick=fn;return b}
function panel(title){const p=add(view,'div',undefined,'panel');add(p,'h2',title);return p}
function openTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{stageFilter=-1;filter='Todos';query='';openTab(b.dataset.tab)});
function render(){view.replaceChildren();if(tab==='journey'){const g=add(view,'div',undefined,'grid');[['Registrados',rows.length],['Calificados',rows.filter(r=>r.elig==='Calificado').length],['No calificados',rows.filter(r=>r.elig==='No calificado').length],['Suscritos (etapa alcanzada)',rows.filter(r=>r.stage>=3).length],['Aprobados',rows.filter(r=>r.stage>=6).length],['Fondeados',rows.filter(r=>r.stage>=7).length]].forEach(([l,n])=>{const m=add(g,'div',undefined,'metric');add(m,'strong',n);add(m,'span',l)});const p=panel('Embudo del Journey');const sg=add(p,'div',undefined,'grid');stages.forEach((s,i)=>{const n=rows.filter(r=>r.stage>=i).length,now=rows.filter(r=>r.stage===i).length;const c=add(sg,'div',undefined,'stage');add(c,'strong',n);add(c,'span',s);const bar=add(c,'div',undefined,'bar');add(bar,'i').style.width=(100*n/rows.length)+'%';add(c,'small',Math.round(100*n/rows.length)+'% · '+now+' aquí ahora');btn(c,'Ver '+now+' usuarios',()=>{stageFilter=i;openTab('clients')})});add(p,'small','Alcanzaron la etapa incluye quienes avanzaron. Aquí ahora muestra la etapa actual. Datos simulados.');const a=panel('Tiempo promedio en etapa actual');stages.forEach((s,i)=>{const r=rows.filter(x=>x.stage===i);add(a,'p',s+': '+(r.length?(r.reduce((n,x)=>n+x.days,0)/r.length).toFixed(1)+' días':'—'))});return}
if(tab==='comms'){const p=panel('Segmentos de seguimiento');stages.slice(0,7).forEach((s,i)=>{const n=rows.filter(r=>r.stage===i&&r.elig!=='No calificado').length;const line=add(p,'p',undefined,'filters');btn(line,s+' · '+n,()=>{stageFilter=i;filter='Contactables demo';openTab('clients')})});add(p,'small','No se envían mensajes. El consentimiento real deberá verificarse antes de contactar.');const q=panel('Próximos seguimientos');rows.filter(r=>r.follow).forEach(r=>btn(q,r.follow+' · '+r.name,()=>show(r)));return}
const p=panel('Clientes');const f=add(p,'div',undefined,'filters');const search=add(f,'input');search.placeholder='Buscar nombre o ID';search.value=query;const sel=add(f,'select');['Todos',...eligibility,'Contactables demo'].forEach(v=>{const o=add(sel,'option',v);o.value=v});sel.value=filter;const st=add(f,'select');['Todas las etapas',...stages].forEach((v,i)=>{const o=add(st,'option',v);o.value=i-1});st.value=stageFilter;const out=add(p,'div',undefined,'scroll');function list(){out.replaceChildren();const t=add(out,'table');const h=add(t,'tr');['ID','Cliente','Elegibilidad','Etapa','Días','Acción'].forEach(v=>add(h,'th',v));rows.filter(r=>(filter==='Todos'||(filter==='Contactables demo'?r.elig!=='No calificado':r.elig===filter))&&(stageFilter<0||r.stage===stageFilter)&&(r.name.toLowerCase().includes(query.toLowerCase())||String(r.id).includes(query))).forEach(r=>{const tr=add(t,'tr');[r.id,r.name,r.elig,stages[r.stage],r.days].forEach(v=>add(tr,'td',v));btn(add(tr,'td'),'Ver ficha',()=>show(r))})}search.oninput=()=>{query=search.value;list()};sel.onchange=()=>{filter=sel.value;list()};st.onchange=()=>{stageFilter=Number(st.value);list()};list()}
function show(r){detail.replaceChildren();add(detail,'h2',r.name+' · #'+r.id);add(detail,'p',r.elig+' · '+stages[r.stage]);add(detail,'p','Estado operativo de solo lectura (simulado).');const l=add(detail,'label','Canal');const c=add(l,'select');['Email','WhatsApp','Teléfono'].forEach(v=>add(c,'option',v));c.value=r.channel;const d=add(add(detail,'label','Próximo seguimiento'),'input');d.type='date';d.value=r.follow;const n=add(add(detail,'label','Notas ficticias'),'textarea');n.value=r.notes;n.maxLength=500;btn(detail,'Guardar en esta sesión',()=>{r.channel=c.value;r.follow=d.value;r.notes=n.value;detail.close();render()}).className='primary';btn(detail,'Cerrar',()=>detail.close());detail.showModal()}
render();
</script></html>
